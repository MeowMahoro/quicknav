org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Fabric Properties (https://fabricmc.net/versions.html)
minecraft_version=26.3
loader_version=0.20.0
loom_version=1.19-SNAPSHOT

# Fabric API
fabric_api_version=0.163.0+26.3

# Dandelion (config framework, https://github.com/AzureAaron/Dandelion)
# Local 26.3 build, see libs/local-maven/README.md
dandelion_version=1.0.0-alpha.22.1+26.3

# Legacy Item DFU (item NBT data fixer for old Hypixel/NEU data, https://github.com/AzureAaron/legacy-item-dfu)
legacy_item_dfu_version = 1.0.4+26.2

# Fabric Language Kotlin (required by Dandelion)
flk_version=1.14.2+kotlin.2.4.21

# Mod Menu (https://modrinth.com/mod/modmenu/versions)
mod_menu_version = 21.0.0

# Yet Another Config Lib (Dandelion's config screen backend, installed separately at runtime)
yacl_version = 3.9.7+26.3-fabric

# Mod Properties
mod_version = 1.1.1
maven_group = net.quicknav
archives_base_name = quicknav
