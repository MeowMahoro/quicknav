name: Build

on:
  push:
    branches: [ "main", "master", "26.1.2", "26.2", "26.3" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

# A push to any version branch rebuilds every version. If several branches are
# pushed together, keep only the newest run instead of building them in parallel.
concurrency:
  group: quicknav-build
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ "26.1.2", "26.2", "26.3" ]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect artifacts
        run: |
          target="dist/quicknav-${{ matrix.branch }}"
          mkdir -p "$target"
          cp build/libs/*.jar "$target/"

          {
            echo "branch: ${{ matrix.branch }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "built-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "triggered-by: ${{ github.ref }}"
          } > "$target/BUILD_INFO.txt"

          ls -l "$target"

      - name: Upload per-version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quicknav-${{ matrix.branch }}
          path: dist/quicknav-${{ matrix.branch }}
          if-no-files-found: error
