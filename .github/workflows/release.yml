name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ "26.1.2", "26.2", "26.3" ]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect artifacts
        run: |
          target="release/quicknav-${{ matrix.branch }}"
          mkdir -p "$target"
          cp build/libs/*.jar "$target/"

          {
            echo "branch: ${{ matrix.branch }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "release-tag: ${{ github.ref_name }}"
            echo "built-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$target/BUILD_INFO.txt"

          ls -l "$target"

      - name: Upload per-version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-quicknav-${{ matrix.branch }}
          path: release/quicknav-${{ matrix.branch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download per-version artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quicknav-*/*.jar
          body_path: CHANGELOG.md
